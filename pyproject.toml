[project]
name = "snapback-btc"
version = "0.0.1"
description = "Deterministic Binance Futures BTC perp bot — multifactor-v1 (RSI 14 + volume + EMA200 + funding)."
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }
dependencies = [
    "ccxt>=4.4.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "structlog>=24.1.0",
    "python-dotenv>=1.0.1",
    "pyyaml>=6.0.2",
    "requests>=2.32.0",
    "pyarrow>=17.0.0",
    "backtesting>=0.3.3",
    "matplotlib>=3.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["strategy", "exchange"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
# E501 line too long (project line-length is 100 but tables in tools/* are wider).
# RUF001-003 false-positive on × (we use it deliberately for "multiplied by" in docs/comments).
# SIM102 nested-if warning — sometimes nested ifs are clearer than `and` chains.
# SIM108 ternary suggestion — refused; explicit if/else is fine.
# B905 zip-without-strict — we want default behaviour everywhere.
ignore = ["E501", "RUF001", "RUF002", "RUF003", "SIM102", "SIM108", "B905"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F401", "F821", "I001", "UP017", "RUF007"]
